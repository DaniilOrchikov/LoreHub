<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LoreHub — конструктор лора</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-header">
      <h1>LoreHub</h1>
      <p>Веб-приложение для разработки лора вселенной</p>
    </header>

    <nav class="tabs">
      <button class="tab-button active" data-tab="lore-tab" type="button">База лора</button>
      <button class="tab-button" data-tab="timeline-tab" type="button">Таймлайн</button>
    </nav>

    <main class="tab-content active" id="lore-tab">
      <div class="layout">
        <section class="panel">
          <h2>Документы</h2>
          <form id="document-form" class="form-grid">
            <label>
              Название
              <input name="title" required placeholder="Например: Дом Воронов" />
            </label>
            <label>
              Тип
              <select name="kind" required>
                <option value="Персонаж">Персонаж</option>
                <option value="Раса">Раса</option>
                <option value="Событие">Событие</option>
                <option value="Локация">Локация</option>
                <option value="История">История</option>
                <option value="Другое">Другое</option>
              </select>
            </label>
            <label class="full">
              Описание
              <textarea name="description" rows="4" placeholder="Краткое описание документа"></textarea>
            </label>
            <button type="submit">Добавить документ</button>
          </form>
          <ul id="documents-list" class="list"></ul>
        </section>

        <section class="panel">
          <h2>Связи</h2>
          <form id="relation-form" class="form-grid">
            <label>
              Документ A
              <select name="fromId" required></select>
            </label>
            <label>
              Тип связи
              <input name="label" required placeholder="например: муж, представитель, союзник" />
            </label>
            <label>
              Документ B
              <select name="toId" required></select>
            </label>
            <button type="submit">Создать связь</button>
          </form>
          <ul id="relations-list" class="list"></ul>
        </section>

        <section class="panel">
          <h2>События</h2>
          <form id="event-form" class="form-grid">
            <label>
              Документ
              <select name="documentId" required></select>
            </label>
            <label>
              Название события
              <input name="name" required placeholder="Коронация" />
            </label>
            <label>
              Начало
              <input type="date" name="start" required />
            </label>
            <label>
              Завершение (опционально)
              <input type="date" name="end" />
            </label>
            <label class="full">
              Подробности
              <textarea name="details" rows="3" placeholder="Что произошло?"></textarea>
            </label>
            <button type="submit">Добавить событие</button>
          </form>
          <ul id="events-list" class="list"></ul>
        </section>
      </div>
    </main>

    <section class="tab-content" id="timeline-tab">
      <div class="layout timeline-layout">
        <section class="panel timeline-panel">
          <h2>Меню таймлайна</h2>
          <div class="timeline-menu">
            <form id="timeline-event-form" class="form-grid inline-form">
              <label>
                Добавить одно событие
                <select id="timeline-event-select"></select>
              </label>
              <button type="submit">Добавить событие</button>
            </form>

            <form id="timeline-document-form" class="form-grid inline-form">
              <label>
                Добавить все события документа
                <select id="timeline-document-select"></select>
              </label>
              <button type="submit">Добавить документ</button>
            </form>

            <div class="inline-form">
              <label>
                Масштаб шкалы
                <select id="timeline-scale">
                  <option value="day">День</option>
                  <option value="month">Месяц</option>
                  <option value="year">Год</option>
                </select>
              </label>
              <button id="timeline-clear" type="button" class="danger">Очистить таймлайн</button>
            </div>
          </div>
        </section>

        <section class="panel timeline-panel">
          <h2>Полотно таймлайна</h2>
          <div id="timeline-canvas" class="timeline-canvas"></div>
        </section>
      </div>
    </section>

    <template id="empty-state-template">
      <li class="empty">Пока пусто. Добавьте данные через форму выше.</li>
    </template>

    <script src="app.js"></script>
  </body>
</html>
